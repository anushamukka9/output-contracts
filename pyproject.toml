[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "output-contracts"
version = "0.1.0"
description = "Declare the JSON your agent tools must return: schema validation plus PII and secret redaction on structured tool outputs, before the model sees them. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anusha Mukka" }]
keywords = ["ai-agents", "tool-outputs", "schema-validation", "pii", "secrets", "redaction", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.4"]

[project.scripts]
output-contracts = "output_contracts.cli:main"

[project.urls]
Homepage = "https://github.com/anushamukka9/output-contracts"
Issues = "https://github.com/anushamukka9/output-contracts/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/output_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
